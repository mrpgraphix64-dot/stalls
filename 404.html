<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — Reworkzone Stalls Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background-color: #FAF9F5;
        color: #111827;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
        padding: 20px;
      }
      .card {
        max-width: 480px;
        background: #ffffff;
        border: 1px solid #E7E5DD;
        border-radius: 20px;
        padding: 40px 30px;
        box-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.05);
      }
      .logo {
        height: 36px;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 28px;
        font-weight: 800;
        margin: 0 0 10px;
      }
      p {
        font-size: 14px;
        color: #6B7280;
        line-height: 1.6;
        margin: 0 0 24px;
      }
      .btn {
        display: inline-block;
        background: #E53935;
        color: #ffffff;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        padding: 12px 28px;
        border-radius: 10px;
        text-decoration: none;
        transition: background 0.2s;
      }
      .btn:hover {
        background: #111827;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/logo.png" alt="Reworkzone" class="logo" />
      <h1>Page Not Found</h1>
      <p>The page or exhibition stall project you're looking for doesn't exist or has moved.</p>
      <a href="/" class="btn">Explore Our Stalls Portfolio</a>
    </div>
  </body>
</html>
